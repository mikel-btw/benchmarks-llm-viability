[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-llm-viability"
version = "0.1.0"
description = "Empirical benchmarking of local LLMs across heterogeneous hardware"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
benchmark-llm = "main:main"

[tool.setuptools.dynamic]
dependencies = { file = "requirements.txt" }

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmarks*", "core*", "config*"]
exclude = ["tests*", "results*", "benchmark_llm_viability.egg-info*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
